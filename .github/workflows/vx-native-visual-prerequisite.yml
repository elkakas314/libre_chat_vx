name: vx-native-visual-prerequisite
on:
  workflow_dispatch:
  push:
    branches: [handoff_current_bootstrps]
    paths:
      - '.github/workflows/vx-native-visual-prerequisite.yml'
      - 'ci/fixtures/native-overlay-prereq.spec.ts'
permissions:
  contents: read
jobs:
  native-and-overlay-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout VX source
        uses: actions/checkout@v4
        with:
          path: vx
      - name: Checkout exact LibreChat upstream
        uses: actions/checkout@v4
        with:
          repository: LibreChat-AI/LibreChat
          ref: f10b1d91f1eee3a2c82d5247bf620351486b7c1b
          path: upstream
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned LibreChat native dependencies
        working-directory: upstream
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: upstream
        run: npx playwright install --with-deps chromium
      - name: Build unmodified LibreChat native frontend
        working-directory: upstream
        run: npm run frontend
      - name: Run upstream authentic native screenshot pilot
        working-directory: upstream
        env:
          E2E_USE_MEMORY_MONGO: 'true'
          E2E_BASE_URL: http://127.0.0.1:3333
          E2E_CAPTURE_DIR: ${{ runner.temp }}/native-original
        run: |
          set -euo pipefail
          export E2E_CAPTURE_SHA="$(git rev-parse HEAD)"
          npx playwright test --config=e2e/screenshots/playwright.config.ts
      - name: Preserve native capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librechat-native-before
          path: ${{ runner.temp }}/native-original/
          retention-days: 14
          if-no-files-found: warn
      - name: Verify and apply reversible VX overlay
        working-directory: vx
        run: |
          npm run verify:upstream -- ../upstream
          npm run overlay:install -- ../upstream
      - name: Build upstream with VX overlay
        working-directory: upstream
        run: |
          mkdir -p node_modules/@librechat
          ln -sfn ../../packages/librechat-vx node_modules/@librechat/vx
          ./node_modules/.bin/tsc -p packages/librechat-vx/tsconfig.json
          npm run frontend:ci
      - name: Install screenshot instrumentation in ephemeral worktree
        run: |
          cp vx/ci/fixtures/native-overlay-prereq.spec.ts upstream/e2e/screenshots/vx-prereq.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/e2e/screenshots/playwright.config.ts')
          s=p.read_text()
          assert "testMatch: 'pilot.spec.ts'" in s
          p.write_text(s.replace("testMatch: 'pilot.spec.ts'","testMatch: 'vx-prereq.spec.ts'"))
          PY
          cd upstream
          git add -A
          git -c user.email=vx-ci@example.invalid -c user.name='VX Test Runner' commit -m 'ci-only: overlay and native visual harness'
          git diff --quiet HEAD
      - name: Inspect VX disabled in mounted native LibreChat
        working-directory: upstream
        env:
          E2E_USE_MEMORY_MONGO: 'true'
          E2E_BASE_URL: http://127.0.0.1:3333
          VX_COCKPIT_FLAG: '0'
          VX_SOURCE_SHA: ${{ github.sha }}
          VX_CAPTURE_DIR: ${{ runner.temp }}/overlay-disabled
        run: |
          export E2E_CAPTURE_SHA="$(git rev-parse HEAD)"
          npx playwright test --config=e2e/screenshots/playwright.config.ts
      - name: Inspect VX enabled in mounted native LibreChat
        if: always()
        working-directory: upstream
        env:
          E2E_USE_MEMORY_MONGO: 'true'
          E2E_BASE_URL: http://127.0.0.1:3333
          VX_COCKPIT_FLAG: '1'
          VX_SOURCE_SHA: ${{ github.sha }}
          VX_CAPTURE_DIR: ${{ runner.temp }}/overlay-enabled
        run: |
          export E2E_CAPTURE_SHA="$(git rev-parse HEAD)"
          npx playwright test --config=e2e/screenshots/playwright.config.ts
      - name: Upload actual upstream overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librechat-vx-mount-prerequisite
          path: |
            ${{ runner.temp }}/overlay-disabled/
            ${{ runner.temp }}/overlay-enabled/
          retention-days: 14
          if-no-files-found: warn
