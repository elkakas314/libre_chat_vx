# FRAGMENTO: fusionar sólo tras inspección y backup del librechat.yaml real.
# Requiere mcpServers existente. Rutas host sólo si LibreChat comparte namespace.
mcpServers:
  nostromo-autonomo:
    type: stdio
    description: "NOSTROMO · terminal local gobernado (R0 / permiso local R2)"
    chatMenu: false # Sólo Agent Builder; no mostrar CLI en el compositor general
    command: node
    args:
      - /home/elkakas314/librechat/vx/deployment/nostromo-mcp/server.mjs
    timeout: 130000
    initTimeout: 30000
    serverInstructions: "Usa preparar antes de ejecutar. R0 lectura; R2 requiere autorización local exacta e independiente. No reiteres operaciones ambiguas. No declares trabajo material verificado por exit 0."
    env:
      NOSTROMO_MCP_ENABLED: '0'
      NOSTROMO_TOOL_SET: 'nostromo_terminal_preparar,nostromo_tarea_iniciar,nostromo_tarea_estado,nostromo_tarea_cancelar'
      NOSTROMO_ALLOWED_ROOTS: /home/elkakas314/librechat/vx:/home/elkakas314/librechat/upstream
      NOSTROMO_APPROVAL_DIR: /home/elkakas314/.local/state/nostromo/approvals
    # Si se omite, se conservan exactamente las cuatro herramientas originales.
    # Para añadir archivos/Git/métricas R0 al mismo MCP (sólo admin):
    # NOSTROMO_TOOL_SET: 'nostromo_terminal_preparar,nostromo_terminal_ejecutar,nostromo_archivo_leer,nostromo_git_inspeccionar,nostromo_metricas'
    # Para desactivar ejecución de terminal y dejar la inspección:
    # NOSTROMO_TOOL_SET: 'nostromo_archivo_leer,nostromo_git_inspeccionar,nostromo_metricas'
    # Asíncrono opt-in, MISMO proceso MCP, 1 tarea activa; sin Worker ni daemon:
    # NOSTROMO_TOOL_SET: 'nostromo_terminal_preparar,nostromo_archivo_leer,nostromo_git_inspeccionar,nostromo_metricas,nostromo_tarea_iniciar,nostromo_tarea_estado,nostromo_tarea_cancelar'
    # El trío iniciar/estado/cancelar debe habilitarse completo. `timeout` 130 s no
    # garantiza persistencia; el gestor retiene resultados sólo mientras vive el MCP.
    # Activar NOSTROMO_MCP_ENABLED=1 sólo tras ACL y rutas host verificadas.
