name: source-check

on:
  push:
    branches:
      - handoff_current_bootstrps
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test
        run: npm test

  overlay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout LibreChat VX
        uses: actions/checkout@v4
        with:
          path: vx
      - name: Checkout pinned LibreChat upstream
        uses: actions/checkout@v4
        with:
          repository: LibreChat-AI/LibreChat
          ref: f10b1d91f1eee3a2c82d5247bf620351486b7c1b
          path: upstream
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned upstream dependencies
        working-directory: upstream
        run: npm ci --no-audit --no-fund
      - name: Verify pinned upstream
        working-directory: vx
        run: npm run verify:upstream -- ../upstream
      - name: Install reversible overlay
        working-directory: vx
        run: npm run overlay:install -- ../upstream
      - name: Link VX workspace without changing upstream lock
        run: |
          mkdir -p upstream/node_modules/@librechat
          ln -sfn ../../packages/librechat-vx upstream/node_modules/@librechat/vx
      - name: Build copied LibreChat VX workspace
        working-directory: upstream/packages/librechat-vx
        run: |
          rm -rf dist
          ../../node_modules/.bin/tsc -p tsconfig.json
      - name: Build LibreChat frontend with VX overlay
        working-directory: upstream
        run: npm run frontend:ci
      - name: Uninstall overlay
        if: always()
        working-directory: vx
        run: npm run overlay:uninstall -- ../upstream
      - name: Verify upstream clean after uninstall
        if: always()
        working-directory: vx
        run: npm run verify:upstream -- ../upstream
