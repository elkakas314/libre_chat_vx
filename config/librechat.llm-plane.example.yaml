# Source-only example. Do not deploy without live readback and network binding.
# Secrets belong in environment/secret storage, never in this file.

endpoints:
  custom:
    - name: "Local-OpenAI-Compatible"
      apiKey: "${LOCAL_LLM_API_KEY}"
      baseURL: "${LOCAL_LLM_BASE_URL}"
      models:
        default: []
        fetch: true

    - name: "External-Free-Router"
      apiKey: "${EXTERNAL_LLM_API_KEY}"
      baseURL: "${EXTERNAL_LLM_BASE_URL}"
      models:
        default: []
        fetch: true

    - name: "MANOJOS3-Managed-Router"
      apiKey: "${MANOJOS3_LLM_API_KEY}"
      baseURL: "${MANOJOS3_LLM_BASE_URL}"
      models:
        default:
          - "manojos-general-free"
          - "manojos-coding-free"
          - "manojos-reasoning-free"
          - "manojos-fast-free"
          - "manojos-long-context-free"
        fetch: true

mcpServers:
  manojos3:
    type: streamable-http
    url: "${MANOJOS3_MCP_URL}"
    timeout: 120000
    startup: false

# If MANOJOS3_MCP_URL resolves to a private/internal address, the concrete
# host:port must also be admitted through LibreChat mcpSettings.allowedAddresses
# (or the appropriate strict domain allowlist) in the deployment config.
#
# Model selection and MCP attachment are independent:
# - model endpoint supplies language/reasoning
# - MANOJOS3 MCP supplies governed actions/Interflows
# An Agent/Model Spec may attach the "manojos3" MCP server after deployment.
