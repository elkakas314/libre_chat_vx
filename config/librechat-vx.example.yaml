version: 1.3.17

# SOURCE EXAMPLE ONLY.
# NOSTROMO is one visible conversational identity. Provider/model selection is
# internal routing detail and should not become an operator selector.
skillSync:
  github:
    enabled: false
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: librechat-vx-skills
        owner: elkakas314
        repo: libre_chat_vx
        ref: handoff_current_bootstrps
        paths:
          - skills
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'

interface:
  modelSelect: false
  parameters: false
  presets: false
  agents: true
  endpointsMenu: false

webSearch:
  searchProvider: "keenable"
  scraperProvider: "keenable"
  rerankerType: "none"
  safeSearch: 1

endpoints:
  agents:
    skills:
      maxCatalogSkills: 24
    capabilities:
      - deferred_tools
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - ocr

# Internal semantic profiles. They are not intended as user-facing personalities.
# CODIGO was deliberately removed: coding/execution belongs to MANOJOS3/VX13/
# ORACULO specialist paths when those targets are bound.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: nostromo-normal
      label: NOSTROMO
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-normal
        greeting: "NOSTROMO. Te entiendo, te lo ordeno y te lo muestro; la autoridad material sigue en tus sistemas."
        promptPrefix: &nostromo_identity |
          Eres NOSTROMO, la identidad conversacional estable de LibreChat VX.
          Tu trabajo principal es comprender al usuario, resolver intención y referencias,
          investigar cuando corresponda, y elegir la mejor representación visual.
          No eres el programador ni el ejecutor material de los sistemas.
          La UI, Tentáculo y el modelo no conceden autoridad material.
          Nunca inventes autorización, PASS, readback, evidence ni receipt.
          Para cambios externos prepara una intención precisa para el target correcto.
    - name: nostromo-rapido
      label: NOSTROMO · interno rápido
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-rapido
        promptPrefix: *nostromo_identity
    - name: nostromo-pensar
      label: NOSTROMO · interno pensar
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-pensar
        promptPrefix: *nostromo_identity
    - name: nostromo-investigar
      label: NOSTROMO · interno investigar
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-investigar
        promptPrefix: *nostromo_identity
    - name: nostromo-visualizar
      label: NOSTROMO · interno visualizar
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-visualizar
        promptPrefix: *nostromo_identity
    - name: nostromo-contexto-largo
      label: NOSTROMO · interno contexto largo
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-contexto-largo
        promptPrefix: *nostromo_identity
    - name: nostromo-vision
      label: NOSTROMO · interno visión
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-vision
        promptPrefix: *nostromo_identity

# GitHub Skill Sync is direct outbound HTTPS from LibreChat to GitHub.
# It does not require MANOJOS3 or a dedicated tunnel.
# Agent Events use the LibreChat application surface; see config/agent_events.current.json.
# Target selection remains independent from model/profile selection.
