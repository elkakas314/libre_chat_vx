version: 1.3.17

# SOURCE EXAMPLE ONLY.
# GitHub Skill Sync is disabled by default so a deployment remains inert until
# the operator explicitly enables it and provides a read-only repository token.
skillSync:
  github:
    enabled: false
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: librechat-vx-skills
        owner: elkakas314
        repo: libre_chat_vx
        ref: handoff_current_bootstrps
        paths:
          - skills
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'

interface:
  modelSelect: true
  parameters: true
  presets: true
  agents: true
  endpointsMenu: true

endpoints:
  agents:
    skills:
      # Prevent an oversized model-visible Skill catalog.
      maxCatalogSkills: 20
    capabilities:
      - deferred_tools
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr
      # execute_code / programmatic_tools intentionally omitted until
      # Code Interpreter is separately admitted and governed.

# Deployment must bind the OpenAI-compatible endpoint to the authenticated
# Cloudflare AI Gateway configured for LibreChat/NOSTROMO.
#
# The user-facing model list is semantic. Concrete provider/model selection
# happens behind Cloudflare dynamic routes and remains diagnostic detail.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: nostromo-normal
      label: NOSTROMO · Normal
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-normal
        greeting: "NOSTROMO. Conversación primero; evidencia antes de afirmar."
        promptPrefix: &nostromo_identity |
          Eres NOSTROMO, la identidad conversacional estable de LibreChat VX.
          Tu identidad no depende del proveedor ni del modelo.
          La UI y el modelo no conceden autoridad material.
          Nunca inventes autorización, PASS, readback, evidence ni receipt.
          Los efectos materiales pertenecen al target y a su cadena gobernada.
    - name: nostromo-rapido
      label: NOSTROMO · Rápido
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-rapido
        promptPrefix: *nostromo_identity
    - name: nostromo-pensar
      label: NOSTROMO · Pensar
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-pensar
        promptPrefix: *nostromo_identity
    - name: nostromo-codigo
      label: NOSTROMO · Código
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-codigo
        promptPrefix: *nostromo_identity
    - name: nostromo-contexto-largo
      label: NOSTROMO · Contexto largo
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-contexto-largo
        promptPrefix: *nostromo_identity
    - name: nostromo-vision
      label: NOSTROMO · Visión
      artifacts: custom
      preset:
        endpoint: openAI
        model: dynamic/nostromo-vision
        promptPrefix: *nostromo_identity

# AUDIO is capability-routed by voice/ASR/TTS integration when enabled.
# It is not a separate operator mode.

# Target selection is independent from model/profile selection.
# LibreChat should call an in-process NostromoTargetGateway facade:
#   MANOJOS3 adapter -> MANOJOS3 MCP
#   VX13 adapter -> Tentáculo Link (future)
#
# mcpServers remain deployment-specific implementation detail of the
# MANOJOS3 target adapter and are intentionally omitted here.
