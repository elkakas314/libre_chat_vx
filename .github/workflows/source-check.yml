name: source-check

on:
  push:
    branches:
      - e2/nostromo-qa-ci-20261112
      - e2/nostromo-source-final-mcp-gates-20261112
      - e2/nostromo-review-backup-ancestor-secret-20261112
      - e2/nostromo-review-mcp-fd-scope-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical JSON with jq
        run: |
          command -v jq
          jq -e 'type == "object"' SPEC.json > /dev/null
          jq -e 'type == "object"' TOPOLOGY.json > /dev/null
          test -f EXPLICACION.md
          test "$(jq -r '.topologia_tuneles_y_transportes["$ref"]' SPEC.json)" = "./TOPOLOGY.json"
          test "$(jq -r '.variables_entorno["$ref"]' TOPOLOGY.json)" = "./SPEC.json#/configuracion/env"
          test "$(jq -r '.variables_entorno.total' TOPOLOGY.json)" = "$(jq -r '.configuracion.env | length' SPEC.json)"
      - name: Validate typed bootstrap runtime state
        run: |
          jq -e -n \
            --slurpfile spec SPEC.json \
            --slurpfile gaps contracts/operating-gap.schema.json \
            --slurpfile bootstrap operating/BOOTSTRAP_CURRENT.json \
            -f tests/validate-bootstrap-runtime.jq > /dev/null
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate parallel transport isolation
        run: npm run transport:validate
      - name: NOSTROMO integration diagnostics (M1-M5)
        run: npm run nostromo:qa:diagnostics
      - name: E2 PR38-43 targeted integration regressions
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts/tests -p 'test_nostromo_backup_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts/tests -p 'test_nostromo_third_upstream_move_gate_r0.py' -v
          node --test scripts/tests/nostromo-backend-decision.test.mjs scripts/tests/nostromo-m4-visual-source-contract.test.mjs scripts/tests/nostromo-mobile-readiness.test.mjs
          node --experimental-strip-types --test scripts/tests/nostromo-m5-mobile-auth.test.mjs
      - name: Explicit TypeScript build
        run: npm run build
      - name: Full VX workspace test suite
        run: npm test
      - name: Validate NOSTROMO standalone terminal MCP (real stdio roundtrip)
        run: |
          npm install --prefix deployment/nostromo-mcp --no-audit --no-fund --package-lock=false
          npm --prefix deployment/nostromo-mcp run check
      - name: Validate agent event SOURCE projection with compiled runtime
        run: node --test canaries/agent-events-live/01-local-delivery.test.cjs

  pinned-upstream-ci-native-mount:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout VX source
        uses: actions/checkout@v4
        with:
          path: vx
      - name: Checkout pinned LibreChat upstream
        uses: actions/checkout@v4
        with:
          repository: LibreChat-AI/LibreChat
          ref: f10b1d91f1eee3a2c82d5247bf620351486b7c1b
          path: upstream
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install upstream dependencies in disposable runner only
        working-directory: upstream
        run: npm ci --no-audit --no-fund
      - name: Verify pinned upstream exact HEAD and source identity
        working-directory: vx
        run: npm run verify:upstream -- ../upstream
      - name: Verify CI staging fail-closed preconditions
        working-directory: vx
        run: node --test ci/tests/nostromo-stage-clean-overlay-ci-only.test.mjs
      - name: Stage exact VX bridge into disposable pinned upstream only
        working-directory: vx
        env:
          NOSTROMO_CI_EPHEMERAL_STAGE: '1'
        run: node ci/nostromo-stage-clean-overlay-ci-only.mjs --stage
      - name: Build VX package and native LibreChat frontend in runner
        working-directory: upstream
        run: |
          test ! -e node_modules/@librechat/vx
          test ! -L node_modules/@librechat/vx
          mkdir -p node_modules/@librechat
          ln -s ../../packages/librechat-vx node_modules/@librechat/vx
          ./node_modules/.bin/tsc -p packages/librechat-vx/tsconfig.json
          npm run frontend:ci
      - name: Validate ephemeral overlay staged identity and compiled package
        working-directory: upstream
        run: |
          test -f packages/librechat-vx/dist/src/index.js
          test -f client/src/components/VX/VXCockpitBridge.tsx
          test -f client/src/components/VX/VXCockpit.css
          grep -Fq 'VXCockpitBridge' client/src/components/Chat/Presentation.tsx
      # Deliberately NO legacy overlay:install/uninstall. These remain blocked
      # to protect user files. This is a disposable CI mount, not host install.

  chromium-source-visual:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual source tooling in disposable runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock esbuild@0.25.9 playwright@1.55.0
      - name: Install Chromium in runner
        run: npx playwright install --with-deps chromium
      - name: Exercise NOSTROMO React source in browser (not host LIVE)
        run: node tests/visual/visual-smoke.cjs
      - name: Retain screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nostromo-qa-pr43-source-visual
          path: visual-evidence/
          retention-days: 14
          if-no-files-found: warn

  canary-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Offline canary library and fixture self-tests (under 30 seconds)
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          started="$(date +%s)"
          timeout 25s bash -euo pipefail -c '
            bash canaries/cf-aig-binding/00-source-sanity.sh
            bash canaries/skill-sync-live/00-source-sanity.sh
            bash canaries/tailscale-mobile-live/00-source-sanity.sh
            bash canaries/web-research-live/00-source-sanity.sh
            bash canaries/agent-events-live/00-source-sanity.sh
            bash canaries/recovery-live/00-source-sanity.sh
            bash canaries/low-power-measure/00-source-sanity.sh
          '
          elapsed="$(( $(date +%s) - started ))"
          test "$elapsed" -lt 30
          echo "PASS canary-self-test elapsed_seconds=$elapsed; offline SOURCE only"
